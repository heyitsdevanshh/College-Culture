<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="45%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="cc-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Gold Tassel Gradient -->
    <linearGradient id="cc-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="cc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="monogram-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2e1065" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#cc-bg)" filter="url(#cc-shadow)" />
  
  <!-- Subtle Inner Rim Highlight -->
  <rect x="5" y="5" width="110" height="110" rx="27" fill="none" stroke="url(#cc-rim)" stroke-width="2" />

  <!-- Ambient Light Reflection -->
  <circle cx="35" cy="30" r="38" fill="#FFFFFF" opacity="0.12" />

  <!-- Monogram & Cap Group -->
  <g filter="url(#monogram-depth)">
    <!-- Interlocking 'C' 1 (Left / Primary) -->
    <path
      d="M 62 55 A 22 22 0 1 0 62 73 L 52 79 A 12 12 0 1 1 52 49 Z"
      fill="#FFFFFF"
    />

    <!-- Interlocking 'C' 2 (Right / Secondary Interlaced) -->
    <path
      d="M 86 52 L 76 57 A 12 12 0 0 1 76 77 L 86 82 A 22 22 0 0 0 86 52 Z"
      fill="#FFFFFF"
      opacity="0.95"
    />
    <path
      d="M 76 57 A 12 12 0 0 0 63 65 L 54 59 A 22 22 0 0 1 77 46 L 79 55 Z"
      fill="#FFFFFF"
      opacity="0.95"
    />
    <path
      d="M 63 67 A 12 12 0 0 0 76 77 L 74 86 A 22 22 0 0 1 54 73 Z"
      fill="#FFFFFF"
      opacity="0.95"
    />

    <!-- Interlock Separation Cutline -->
    <path
      d="M 52 49 L 62 55 A 22 22 0 0 1 62 73 L 52 79"
      stroke="#7C3AED"
      stroke-width="2"
      stroke-linecap="round"
      fill="none"
    />

    <!-- GRADUATION CAP atop C1 -->
    <!-- Cap Skull Base Band -->
    <path
      d="M 37 31 L 37 36 C 37 40 55 40 55 36 L 55 31 Z"
      fill="#F8FAFC"
    />

    <!-- Cap Top Diamond Board -->
    <polygon
      points="46,18 67,25 46,32 25,25"
      fill="#FFFFFF"
      stroke="#F8FAFC"
      stroke-width="0.5"
    />
    <polygon
      points="46,18 67,25 46,26 25,25"
      fill="#E2E8F0"
      opacity="0.75"
    />

    <!-- Center Golden Button -->
    <circle cx="46" cy="25" r="2.5" fill="url(#cc-gold)" />

    <!-- Hanging Golden Tassel -->
    <path
      d="M 46 25 C 33 27 28 32 27 38 L 27 47"
      fill="none"
      stroke="url(#cc-gold)"
      stroke-width="2.2"
      stroke-linecap="round"
    />
    <circle cx="27" cy="47" r="1.8" fill="#D97706" />
    <path
      d="M 25 47 H 29 L 30.5 54 H 23.5 Z"
      fill="url(#cc-gold)"
    />
  </g>
</svg>
